<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul Journal — Scan to open the app</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:#EAF6EF; font-family:-apple-system, 'Segoe UI', Roboto, sans-serif; }
  .card { background:#fff; border-radius:24px; padding:40px 48px; text-align:center;
          box-shadow:0 20px 50px -20px rgba(5,150,105,.35); border:1px solid rgba(5,150,105,.15); }
  h1 { color:#065f46; font-size:26px; margin:0 0 6px; }
  p { color:#047857; font-size:16px; margin:0 0 24px; }
  img { width:min(320px, 78vw); height:auto; display:block; margin:0 auto; border-radius:12px; }
  .url { margin-top:22px; font-size:14px; color:#065f46; word-break:break-all;
          background:#F0FDF4; padding:10px 14px; border-radius:10px; }
  .step { font-size:13px; color:#166534; margin-top:18px; line-height:1.6; }
</style>
</head>
<body>
  <div class="card">
    <h1>📓 Soul Journal</h1>
    <p>Scan with <b>Expo Go</b> to open the app</p>
    <img src="/qr-mobile.png" alt="QR code">
    <div class="url">exp://c6yzfqi-anonymous-8090.exp.direct</div>
    <div class="step">1. Open <b>Expo Go</b> on your phone<br>2. Scan this code with the in-app scanner</div>
  </div>
</body>
</html>
