<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soul Journal Offline</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f4eee6;
        --foreground: #1a1a1a;
        --primary: #7b5cf5;
        --card: rgba(255, 255, 255, 0.82);
        --border: rgba(123, 92, 245, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(123, 92, 245, 0.18), transparent 32%),
          linear-gradient(180deg, #f7f2eb 0%, var(--background) 100%);
        color: var(--foreground);
      }

      .card {
        width: min(100%, 420px);
        padding: 32px 28px;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(26, 26, 26, 0.08);
        text-align: center;
      }

      .mark {
        width: 76px;
        height: 76px;
        margin: 0 auto 20px;
        border-radius: 24px;
        display: grid;
        place-items: center;
        font-size: 32px;
        background: linear-gradient(135deg, rgba(123, 92, 245, 0.18), rgba(123, 92, 245, 0.9));
        color: white;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(26, 26, 26, 0.72);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">🎙️</div>
      <h1>You're offline</h1>
      <p>Your saved app shell is ready, but live journal data needs a connection. Reconnect and reopen Soul Journal to sync everything.</p>
    </main>
  </body>
</html>
